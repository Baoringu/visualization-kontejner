name: application-checks

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pallet_building_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pallet_building_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: pallet_building_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e 'apps/api[test]'
      - run: python -m pip install -e packages/packer
      - run: ruff check apps/api/src packages/packer/src apps/api/tests packages/packer/tests
      - run: PYTHONPATH=apps/api/src:packages/packer/src mypy --follow-imports=silent --ignore-missing-imports apps/api/src/app packages/packer/src/pallet_building_packer
      - name: Migration and Python tests
        run: |
          export TEST_DATABASE_URL="postgresql+psycopg://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}"
          export DATABASE_URL="$TEST_DATABASE_URL"
          export PYTHONPATH=apps/api/src:packages/packer/src
          alembic -c apps/api/alembic.ini upgrade head
          pytest apps/api/tests packages/packer/tests -q
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI contract drift
        run: |
          PYTHONPATH=apps/api/src:packages/packer/src python apps/api/scripts/export_openapi.py
          pnpm contract:generate
          git diff --exit-code -- apps/web/src/lib/api/openapi.json apps/web/src/lib/api/schema.d.ts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
