services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kontejner
      POSTGRES_USER: pallet_building
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pallet_building -d kontejner"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
